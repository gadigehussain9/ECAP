apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecap-api
  namespace: ecap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecap-api
  template:
    metadata:
      labels:
        app: ecap-api
    spec:
      containers:
      - name: ecap-api
        image: ecap-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: ecap-secrets
              key: db-connection-string
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
