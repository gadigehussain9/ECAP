name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/ECAP.UnitTests --no-build --verbosity normal --configuration Release

    - name: Run Integration Tests
      run: dotnet test tests/ECAP.IntegrationTests --no-build --verbosity normal --configuration Release

    - name: Run Architecture Tests
      run: dotnet test tests/ECAP.ArchitectureTests --no-build --verbosity normal --configuration Release

    - name: Code Coverage
      run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./coverage --configuration Release

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/**/coverage.cobertura.xml
        fail_ci_if_error: true

    - name: Build Docker image
      run: docker build -t ecap-api:${{ github.sha }} -f Dockerfile .

    - name: Run security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ecap-api:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
