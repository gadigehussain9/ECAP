name: CD - Staging

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build and publish
      run: dotnet publish src/Presentation/ECAP.Api/ECAP.Api.csproj -c Release -o ./publish

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ecap-api:staging-${{ github.sha }} .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/ecap-api:staging-${{ github.sha }}

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
        images: ${{ secrets.ACR_LOGIN_SERVER }}/ecap-api:staging-${{ github.sha }}

    - name: Run smoke tests
      run: |
        sleep 30
        curl -f https://${{ secrets.STAGING_URL }}/health || exit 1
