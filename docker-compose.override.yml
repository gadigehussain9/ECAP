# Docker Compose override for local development
# This file is automatically merged with docker-compose.yml when running docker-compose up
version: '3.8'

services:
  api:
    build:
      target: build  # Use build stage for hot reload
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EcapDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;
    volumes:
      # Enable hot reload by mounting source code
      - ./src:/src/src:ro
    ports:
      - "5000:8080"   # HTTP
      - "5001:8081"   # HTTPS (if configured)
